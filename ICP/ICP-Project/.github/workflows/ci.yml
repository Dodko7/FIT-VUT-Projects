name: C++ Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# Add permissions for GitHub Actions
permissions:
  contents: read
  issues: write

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        # Install build tools and basic dependencies
        sudo apt-get install -y g++ make jq curl build-essential
        
        # Install Qt5 using apt packages that are definitely available
        echo "=== Installing Qt5 using apt packages ==="
        sudo apt-get install -y qtbase5-dev qt5-qmake qttools5-dev-tools
        sudo apt-get install -y libqt5core5a libqt5gui5 libqt5widgets5
        sudo apt-get install -y libqt5network5 libqt5xml5 libqt5sql5
        sudo apt-get install -y libqt5script5 qtscript5-dev
        
        # List installed Qt packages and versions
        echo "=== Installed Qt packages ==="
        dpkg -l | grep qt5
        echo "=== Qt binaries ==="
        which qmake moc 
        echo "=== Qt version ==="
        qmake --version
    
    - name: Install Dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        # Use the built-in Qt installation instead of installing via brew
        echo "=== Using pre-installed Qt on macOS runners ==="
        
        # The GitHub macOS runners normally have Qt pre-installed
        # We'll also try a more direct installation approach if needed
        export QT_DIR="/usr/local/opt/qt@5"
        
        if [ ! -d "$QT_DIR" ]; then
          echo "Qt not found in default location, attempting installation..."
          # Try a more direct approach to install Qt
          HOMEBREW_NO_AUTO_UPDATE=1 brew install qt@5 || true
          
          # If still not available, try installing qtscript separately
          if [ -d "$QT_DIR" ]; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install qtscript || echo "QtScript installation skipped"
          fi
        fi
        
        # Add Qt to PATH regardless of installation method
        echo "Adding Qt to PATH"
        echo "$QT_DIR/bin" >> $GITHUB_PATH
        export PATH="$QT_DIR/bin:$PATH"
        
        # Verify Qt installation
        echo "=== Qt version and location ==="
        which qmake || echo "qmake not found"
        qmake --version || echo "qmake not available"
        ls -la $QT_DIR/bin || echo "Qt bin directory not found"
    
    - name: Create Directory Structure
      run: mkdir -p lib/catch2 lib/nlohmann/single_include
    
    - name: Download Dependencies
      run: |
        curl -L https://github.com/catchorg/Catch2/releases/download/v2.13.9/catch.hpp -o lib/catch2/catch.hpp
        curl -L https://github.com/nlohmann/json/releases/download/v3.11.2/json.hpp -o lib/nlohmann/single_include/nlohmann/json.hpp
        
    - name: Inspect Original Makefile
      run: |
        echo "=== Original Makefile Qt Configuration ==="
        grep -E "QT_PREFIX|MOC|MOCFLAGS|QtCore|QtScript" Makefile || echo "No Qt configuration found in Makefile"
        echo "Makefile content:"
        head -n 30 Makefile
    
    - name: Prepare Makefile for CI
      run: |
        if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          # Create a modified Makefile for Ubuntu with paths to system Qt
          # Change Qt paths to system paths
          sed -i 's|QT_PREFIX = /opt/homebrew/Cellar/qt@5/5.15.16_2|QT_PREFIX = /usr|g' Makefile
          sed -i 's|MOC = /opt/homebrew/opt/qt@5/bin/moc|MOC = /usr/bin/moc|g' Makefile
          
          # Change linking flags for Linux
          sed -i 's|-framework QtCore -framework QtScript|-lQt5Core -lQt5Script|g' Makefile
          
          # Update include paths for system Qt
          sed -i 's|MOCFLAGS = -I/opt/homebrew/opt/qt@5/include|MOCFLAGS = -I/usr/include/x86_64-linux-gnu/qt5 -I/usr/include/qt5|g' Makefile
          sed -i 's|-I/opt/homebrew/opt/qt@5/include/QtCore|-I/usr/include/x86_64-linux-gnu/qt5/QtCore -I/usr/include/qt5/QtCore|g' Makefile
          sed -i 's|-I/opt/homebrew/opt/qt@5/include/QtScript|-I/usr/include/x86_64-linux-gnu/qt5/QtScript -I/usr/include/qt5/QtScript|g' Makefile
          
          # Add library paths for Linux
          sed -i 's|LDFLAGS =|LDFLAGS = -L/usr/lib/x86_64-linux-gnu|g' Makefile || echo "Failed to add library path"
          
          # Debugging - print updated include paths in Makefile
          echo "=== Updated Makefile Qt paths ==="
          grep -E "QT_PREFIX|MOC|MOCFLAGS|Qt|LDFLAGS" Makefile || echo "No Qt paths found in Makefile"
        fi

    - name: Build
      id: build
      run: |
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          export PATH="/usr/local/opt/qt@5/bin:$PATH"
          export PKG_CONFIG_PATH="/usr/local/opt/qt@5/lib/pkgconfig:$PKG_CONFIG_PATH"
          export LDFLAGS="-L/usr/local/opt/qt@5/lib"
          export CPPFLAGS="-I/usr/local/opt/qt@5/include"
        elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          # Set environment variables for system Qt
          export QT_SELECT=qt5
          export QT_PLUGIN_PATH=/usr/lib/x86_64-linux-gnu/qt5/plugins
          
          # Debug Qt installation
          echo "=== Qt installation paths ==="
          echo "QT_PLUGIN_PATH: $QT_PLUGIN_PATH"
          
          # Check Qt libraries and binaries
          echo "=== Qt libraries ==="
          ls -la /usr/lib/x86_64-linux-gnu/libQt5* || echo "No Qt libraries found in /usr/lib"
          echo "=== Qt includes ==="
          ls -la /usr/include/x86_64-linux-gnu/qt5 || echo "No Qt includes found"
        fi
        
        # Print Qt version
        echo "=== Qt Version ==="
        qmake --version || echo "qmake not found"
        
        # Build with detailed output
        echo "=== Starting build ==="
        make > build-output.txt 2>&1 || { 
          cat build-output.txt
          echo "failed=true" >> $GITHUB_OUTPUT
        }
    
    - name: Prepare Build Failure Issue
      if: steps.build.outputs.failed == 'true'
      run: |
        BUILD_OUTPUT=$(cat build-output.txt)
        echo "FAILURE_TYPE=Build" >> $GITHUB_ENV
        echo "TEST_OUTPUT<<EOF" >> $GITHUB_ENV
        echo "$BUILD_OUTPUT" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
        echo "TEST_SUMMARY=Build failed, see details above" >> $GITHUB_ENV
    
    - name: Run Tests
      id: test
      if: steps.build.outputs.failed != 'true'
      run: |
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          export PATH="/usr/local/opt/qt@5/bin:$PATH"
          export PKG_CONFIG_PATH="/usr/local/opt/qt@5/lib/pkgconfig:$PKG_CONFIG_PATH"
          export LDFLAGS="-L/usr/local/opt/qt@5/lib"
          export CPPFLAGS="-I/usr/local/opt/qt@5/include"
        elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          # Set environment variables for system Qt
          export QT_SELECT=qt5
          export QT_PLUGIN_PATH=/usr/lib/x86_64-linux-gnu/qt5/plugins
        fi
        
        # Use the test target to compile and run tests
        echo "=== Building and running tests ==="
        make test > test-output.txt 2>&1 || { 
          cat test-output.txt
          echo "failed=true" >> $GITHUB_OUTPUT
        }
        
        # Check if test report file exists and print basic stats
        if [ -f "fsm_test_report.txt" ]; then
          echo "=== Test results summary ==="
          echo "Test report found at fsm_test_report.txt"
          cat fsm_test_report.txt
        fi
        
    - name: Prepare Issue Content
      if: steps.test.outputs.failed == 'true'
      run: |
        # Get test output
        TEST_OUTPUT=$(cat test-output.txt)
        echo "FAILURE_TYPE=Test" >> $GITHUB_ENV
        echo "TEST_OUTPUT<<EOF" >> $GITHUB_ENV
        echo "$TEST_OUTPUT" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
        
        # Extract more detailed test information if fsm_test_report.txt exists
        if [ -f "fsm_test_report.txt" ]; then
          # Extract test results from the FSM test report
          echo "=== Extracting test results from FSM test report ==="
          PASSED_TESTS=$(grep -o "PASS" fsm_test_report.txt | wc -l || echo "Unknown")
          FAILED_TESTS=$(grep -o "FAIL" fsm_test_report.txt | wc -l || echo "Unknown")
          TOTAL_TESTS=$(($PASSED_TESTS + $FAILED_TESTS))
          echo "TEST_SUMMARY=Failed $FAILED_TESTS of $TOTAL_TESTS test cases" >> $GITHUB_ENV
          
          # Include detailed failures in the GitHub issue
          if [ "$FAILED_TESTS" -gt "0" ] && [ "$FAILED_TESTS" != "Unknown" ]; then
            echo "DETAILED_FAILURES<<EOF" >> $GITHUB_ENV
            grep -B 2 -A 5 "FAIL" fsm_test_report.txt >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi
        else
          # Fallback to grep method if report file doesn't exist
          FAILED_COUNT=$(grep -o 'TEST_RESULT:FAIL' test-output.txt | wc -l)
          echo "TEST_SUMMARY=Failed $FAILED_COUNT test cases" >> $GITHUB_ENV
        fi
    
    - name: Set DateTime for Issue
      if: steps.build.outputs.failed == 'true' || steps.test.outputs.failed == 'true'
      run: |
        # Generate current datetime in format: YYYY-MM-DD HH:MM UTC
        echo "DATETIME=$(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_ENV
      continue-on-error: true
    
    - name: Create Issue on Failure
      uses: JasonEtco/create-an-issue@v2
      if: steps.build.outputs.failed == 'true' || steps.test.outputs.failed == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        OS: ${{ matrix.os }}
        # Explicitly provide GitHub context variables
        GH_SHA: ${{ github.sha }}
        GH_REF_NAME: ${{ github.ref_name }}
        GH_ACTOR: ${{ github.actor }}
        GH_REPOSITORY: ${{ github.repository }}
        GH_RUN_ID: ${{ github.run_id }}
        GH_HEAD_COMMIT: ${{ toJSON(github.event.head_commit.message) }}
      with:
        filename: .github/test-failure-template.md
        update_existing: false
