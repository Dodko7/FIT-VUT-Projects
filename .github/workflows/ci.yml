name: C++ Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# Add permissions for GitHub Actions
permissions:
  contents: read
  issues: write

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        # Install build tools and basic dependencies
        sudo apt-get install -y g++ make jq curl build-essential libgl1-mesa-dev
        
        # Install Qt5 using the official installer
        echo "=== Installing Qt5 from the official installer ==="
        mkdir -p ~/qt-installer
        cd ~/qt-installer
        # Download the Qt online installer
        wget -q https://download.qt.io/official_releases/qt/5.15/5.15.2/qt-opensource-linux-x64-5.15.2.run
        chmod +x qt-opensource-linux-x64-5.15.2.run
        
        # Create a script for non-interactive installation
        cat > qt-installer-noninteractive.qs << EOF
        function Controller() {
            installer.autoRejectMessageBoxes();
            installer.installationFinished.connect(function() {
                gui.clickButton(buttons.NextButton);
            });
        }
        Controller.prototype.WelcomePageCallback = function() {
            gui.clickButton(buttons.NextButton, 3000);
        };
        Controller.prototype.CredentialsPageCallback = function() {
            gui.clickButton(buttons.NextButton);
        };
        Controller.prototype.IntroductionPageCallback = function() {
            gui.clickButton(buttons.NextButton);
        };
        Controller.prototype.TargetDirectoryPageCallback = function() {
            gui.currentPageWidget().TargetDirectoryLineEdit.setText("/opt/qt5");
            gui.clickButton(buttons.NextButton);
        };
        Controller.prototype.ComponentSelectionPageCallback = function() {
            var widget = gui.currentPageWidget();
            widget.deselectAll();
            widget.selectComponent("qt.qt5.5152.gcc_64");
            widget.selectComponent("qt.qt5.5152.qtscript");
            gui.clickButton(buttons.NextButton);
        };
        Controller.prototype.LicenseAgreementPageCallback = function() {
            gui.currentPageWidget().AcceptLicenseRadioButton.setChecked(true);
            gui.clickButton(buttons.NextButton);
        };
        Controller.prototype.StartMenuDirectoryPageCallback = function() {
            gui.clickButton(buttons.NextButton);
        };
        Controller.prototype.ReadyForInstallationPageCallback = function() {
            gui.clickButton(buttons.NextButton);
        };
        Controller.prototype.FinishedPageCallback = function() {
            var checkBoxForm = gui.currentPageWidget().LaunchQtCreatorCheckBoxForm;
            if (checkBoxForm && checkBoxForm.launchQtCreatorCheckBox) {
                checkBoxForm.launchQtCreatorCheckBox.checked = false;
            }
            gui.clickButton(buttons.FinishButton);
        };
        EOF
        
        # Run the installer non-interactively
        ./qt-opensource-linux-x64-5.15.2.run --script qt-installer-noninteractive.qs --no-force-installations -v
        
        # Verify installation and add to PATH
        echo "=== Qt5 installation complete, setting up environment ==="
        sudo ln -sf /opt/qt5/5.15.2/gcc_64/bin/qmake /usr/local/bin/qmake
        sudo ln -sf /opt/qt5/5.15.2/gcc_64/bin/moc /usr/local/bin/moc
        
        # List installed Qt components
        echo "=== Installed Qt Files ==="
        ls -la /opt/qt5/5.15.2/gcc_64/bin/
        qmake --version || echo "qmake not found in PATH"
    
    - name: Install Dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew update
        brew install qt@5
        # Make sure QtScript is available
        brew install qtscript || echo "QtScript already included in qt@5"
        brew install jq
        echo "Adding Qt to PATH"
        echo "/usr/local/opt/qt@5/bin" >> $GITHUB_PATH
        # List Qt packages for debugging
        brew list | grep qt
    
    - name: Create Directory Structure
      run: mkdir -p lib/catch2 lib/nlohmann/single_include
    
    - name: Download Dependencies
      run: |
        curl -L https://github.com/catchorg/Catch2/releases/download/v2.13.9/catch.hpp -o lib/catch2/catch.hpp
        curl -L https://github.com/nlohmann/json/releases/download/v3.11.2/json.hpp -o lib/nlohmann/single_include/nlohmann/json.hpp
        
    - name: Inspect Original Makefile
      run: |
        echo "=== Original Makefile Qt Configuration ==="
        grep -E "QT_PREFIX|MOC|MOCFLAGS|QtCore|QtScript" Makefile || echo "No Qt configuration found in Makefile"
        echo "Makefile content:"
        head -n 30 Makefile
    
    - name: Prepare Makefile for CI
      run: |
        if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          # Create a modified Makefile for Ubuntu with paths to our custom Qt installation
          # Change Qt paths to official Qt installation
          sed -i 's|QT_PREFIX = /opt/homebrew/Cellar/qt@5/5.15.16_2|QT_PREFIX = /opt/qt5/5.15.2/gcc_64|g' Makefile
          sed -i 's|MOC = /opt/homebrew/opt/qt@5/bin/moc|MOC = /opt/qt5/5.15.2/gcc_64/bin/moc|g' Makefile
          
          # Change linking flags for Linux
          sed -i 's|-framework QtCore -framework QtScript|-lQt5Core -lQt5Script|g' Makefile
          
          # Update include paths for the custom installation
          sed -i 's|MOCFLAGS = -I/opt/homebrew/opt/qt@5/include|MOCFLAGS = -I/opt/qt5/5.15.2/gcc_64/include|g' Makefile
          sed -i 's|-I/opt/homebrew/opt/qt@5/include/QtCore|-I/opt/qt5/5.15.2/gcc_64/include/QtCore|g' Makefile
          sed -i 's|-I/opt/homebrew/opt/qt@5/include/QtScript|-I/opt/qt5/5.15.2/gcc_64/include/QtScript|g' Makefile
          
          # Add library path for Linux
          sed -i 's|LDFLAGS =|LDFLAGS = -L/opt/qt5/5.15.2/gcc_64/lib|g' Makefile || echo "Failed to add library path"
          
          # Debugging - print updated include paths in Makefile
          echo "=== Updated Makefile Qt paths ==="
          grep -E "QT_PREFIX|MOC|MOCFLAGS|Qt|LDFLAGS" Makefile || echo "No Qt paths found in Makefile"
        fi

    - name: Build
      id: build
      run: |
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          export PATH="/usr/local/opt/qt@5/bin:$PATH"
          export PKG_CONFIG_PATH="/usr/local/opt/qt@5/lib/pkgconfig:$PKG_CONFIG_PATH"
          export LDFLAGS="-L/usr/local/opt/qt@5/lib"
          export CPPFLAGS="-I/usr/local/opt/qt@5/include"
        elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          # Set up environment for our custom Qt installation
          export PATH="/opt/qt5/5.15.2/gcc_64/bin:$PATH"
          export LD_LIBRARY_PATH="/opt/qt5/5.15.2/gcc_64/lib:$LD_LIBRARY_PATH"
          export QT_PLUGIN_PATH="/opt/qt5/5.15.2/gcc_64/plugins"
          
          # Debug Qt installation
          echo "=== Qt installation paths ==="
          echo "PATH: $PATH"
          echo "LD_LIBRARY_PATH: $LD_LIBRARY_PATH"
          echo "QT_PLUGIN_PATH: $QT_PLUGIN_PATH"
          
          # Check Qt libraries and binaries
          echo "=== Qt libraries ==="
          ls -la /opt/qt5/5.15.2/gcc_64/lib/libQt5* || echo "No Qt libraries found"
          echo "=== Qt includes ==="
          ls -la /opt/qt5/5.15.2/gcc_64/include/Qt* || echo "No Qt includes found"
        fi
        
        # Print Qt version
        echo "=== Qt Version ==="
        qmake --version || echo "qmake not found"
        
        # Build with detailed output
        echo "=== Starting build ==="
        make > build-output.txt 2>&1 || { 
          cat build-output.txt
          echo "failed=true" >> $GITHUB_OUTPUT
        }
    
    - name: Prepare Build Failure Issue
      if: steps.build.outputs.failed == 'true'
      run: |
        BUILD_OUTPUT=$(cat build-output.txt)
        echo "FAILURE_TYPE=Build" >> $GITHUB_ENV
        echo "TEST_OUTPUT<<EOF" >> $GITHUB_ENV
        echo "$BUILD_OUTPUT" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
        echo "TEST_SUMMARY=Build failed, see details above" >> $GITHUB_ENV
    
    - name: Run Tests
      id: test
      if: steps.build.outputs.failed != 'true'
      run: |
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          export PATH="/usr/local/opt/qt@5/bin:$PATH"
          export PKG_CONFIG_PATH="/usr/local/opt/qt@5/lib/pkgconfig:$PKG_CONFIG_PATH"
          export LDFLAGS="-L/usr/local/opt/qt@5/lib"
          export CPPFLAGS="-I/usr/local/opt/qt@5/include"
        elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          # Set up environment for our custom Qt installation
          export PATH="/opt/qt5/5.15.2/gcc_64/bin:$PATH"
          export LD_LIBRARY_PATH="/opt/qt5/5.15.2/gcc_64/lib:$LD_LIBRARY_PATH"
          export QT_PLUGIN_PATH="/opt/qt5/5.15.2/gcc_64/plugins"
        fi
        
        # Use the same test target for both platforms
        echo "=== Running tests ==="
        make test > test-output.txt 2>&1 || { 
          cat test-output.txt
          echo "failed=true" >> $GITHUB_OUTPUT
        }
        
    - name: Prepare Issue Content
      if: steps.test.outputs.failed == 'true'
      run: |
        # Get test output
        TEST_OUTPUT=$(cat test-output.txt)
        echo "FAILURE_TYPE=Test" >> $GITHUB_ENV
        echo "TEST_OUTPUT<<EOF" >> $GITHUB_ENV
        echo "$TEST_OUTPUT" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
        
        # Create a short summary
        FAILED_COUNT=$(grep -o 'test cases failed' test-output.txt | wc -l)
        echo "TEST_SUMMARY=Failed $FAILED_COUNT test cases" >> $GITHUB_ENV
    
    - name: Set DateTime for Issue
      if: steps.build.outputs.failed == 'true' || steps.test.outputs.failed == 'true'
      run: |
        # Generate current datetime in format: YYYY-MM-DD HH:MM UTC
        echo "DATETIME=$(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_ENV
      continue-on-error: true
    
    - name: Create Issue on Failure
      uses: JasonEtco/create-an-issue@v2
      if: steps.build.outputs.failed == 'true' || steps.test.outputs.failed == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        OS: ${{ matrix.os }}
        # Explicitly provide GitHub context variables
        GH_SHA: ${{ github.sha }}
        GH_REF_NAME: ${{ github.ref_name }}
        GH_ACTOR: ${{ github.actor }}
        GH_REPOSITORY: ${{ github.repository }}
        GH_RUN_ID: ${{ github.run_id }}
        GH_HEAD_COMMIT: ${{ toJSON(github.event.head_commit.message) }}
      with:
        filename: .github/test-failure-template.md
        update_existing: false
