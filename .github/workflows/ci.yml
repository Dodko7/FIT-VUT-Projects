name: C++ Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# Add permissions for GitHub Actions
permissions:
  contents: read
  issues: write

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        # Install build tools
        sudo apt-get install -y g++ make jq curl
        # Install complete Qt5 environment and dependencies
        sudo apt-get install -y qt5-default qtbase5-dev qt5-qmake qttools5-dev qttools5-dev-tools
        # Install Qt5 libraries
        sudo apt-get install -y libqt5core5a libqt5gui5 libqt5widgets5 libqt5network5 libqt5xml5 libqt5sql5 
        sudo apt-get install -y libqt5printsupport5 libqt5dbus5 libqt5test5 libqt5concurrent5
        # Install Qt5 modules
        sudo apt-get install -y libqt5script5 qtscript5-dev
        # List installed Qt packages for debugging
        echo "=== Installed Qt5 Packages ==="
        dpkg -l | grep qt5
    
    - name: Install Dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew update
        brew install qt@5
        # Make sure QtScript is available
        brew install qtscript || echo "QtScript already included in qt@5"
        brew install jq
        echo "Adding Qt to PATH"
        echo "/usr/local/opt/qt@5/bin" >> $GITHUB_PATH
        # List Qt packages for debugging
        brew list | grep qt
    
    - name: Create Directory Structure
      run: mkdir -p lib/catch2 lib/nlohmann/single_include
    
    - name: Download Dependencies
      run: |
        curl -L https://github.com/catchorg/Catch2/releases/download/v2.13.9/catch.hpp -o lib/catch2/catch.hpp
        curl -L https://github.com/nlohmann/json/releases/download/v3.11.2/json.hpp -o lib/nlohmann/single_include/nlohmann/json.hpp
        
    - name: Inspect Original Makefile
      run: |
        echo "=== Original Makefile Qt Configuration ==="
        grep -E "QT_PREFIX|MOC|MOCFLAGS|QtCore|QtScript" Makefile || echo "No Qt configuration found in Makefile"
        echo "Makefile content:"
        head -n 30 Makefile
    
    - name: Prepare Makefile for CI
      run: |
        if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          # Create a modified Makefile for Ubuntu
          # Change Qt paths
          sed -i 's|QT_PREFIX = /opt/homebrew/Cellar/qt@5/5.15.16_2|QT_PREFIX = /usr|g' Makefile
          sed -i 's|MOC = /opt/homebrew/opt/qt@5/bin/moc|MOC = /usr/bin/moc|g' Makefile
          # Change linking flags for Linux
          sed -i 's|-framework QtCore -framework QtScript|-lQt5Core -lQt5Script|g' Makefile
          # Update include paths for Linux - use generic paths for better compatibility
          sed -i 's|MOCFLAGS = -I/opt/homebrew/opt/qt@5/include|MOCFLAGS = -I/usr/include/qt5 -I/usr/include/x86_64-linux-gnu/qt5|g' Makefile
          sed -i 's|-I/opt/homebrew/opt/qt@5/include/QtCore|-I/usr/include/qt5/QtCore -I/usr/include/x86_64-linux-gnu/qt5/QtCore|g' Makefile
          sed -i 's|-I/opt/homebrew/opt/qt@5/include/QtScript|-I/usr/include/qt5/QtScript -I/usr/include/x86_64-linux-gnu/qt5/QtScript|g' Makefile
          
          # Debugging - print updated include paths in Makefile
          echo "=== Updated Makefile Qt paths ==="
          grep -E "QT_PREFIX|MOC|MOCFLAGS|Qt" Makefile || echo "No Qt paths found in Makefile"
        fi

    - name: Build
      id: build
      run: |
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          export PATH="/usr/local/opt/qt@5/bin:$PATH"
          export PKG_CONFIG_PATH="/usr/local/opt/qt@5/lib/pkgconfig:$PKG_CONFIG_PATH"
          export LDFLAGS="-L/usr/local/opt/qt@5/lib"
          export CPPFLAGS="-I/usr/local/opt/qt@5/include"
        elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          # Set Qt environment variables for Linux
          export QT_SELECT=qt5
          export QT_PLUGIN_PATH=/usr/lib/x86_64-linux-gnu/qt5/plugins
          export QT_QPA_PLATFORM_PLUGIN_PATH=/usr/lib/x86_64-linux-gnu/qt5/plugins/platforms
          
          # Debug Qt installations
          echo "=== Qt installation paths ==="
          ls -la /usr/include/qt5 || echo "Directory /usr/include/qt5 not found"
          ls -la /usr/include/x86_64-linux-gnu/qt5 || echo "Directory /usr/include/x86_64-linux-gnu/qt5 not found"
          echo "=== Qt pkg-config details ==="
          pkg-config --list-all | grep -i qt || echo "No Qt pkg-config files found"
        fi
        
        # Print Qt version
        echo "=== Qt Version ==="
        qmake --version || echo "qmake not found"
        
        # Build with detailed output
        echo "=== Starting build ==="
        make > build-output.txt 2>&1 || { 
          cat build-output.txt
          echo "failed=true" >> $GITHUB_OUTPUT
        }
    
    - name: Prepare Build Failure Issue
      if: steps.build.outputs.failed == 'true'
      run: |
        BUILD_OUTPUT=$(cat build-output.txt)
        echo "FAILURE_TYPE=Build" >> $GITHUB_ENV
        echo "TEST_OUTPUT<<EOF" >> $GITHUB_ENV
        echo "$BUILD_OUTPUT" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
        echo "TEST_SUMMARY=Build failed, see details above" >> $GITHUB_ENV
    
    - name: Run Tests
      id: test
      if: steps.build.outputs.failed != 'true'
      run: |
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          export PATH="/usr/local/opt/qt@5/bin:$PATH"
          export PKG_CONFIG_PATH="/usr/local/opt/qt@5/lib/pkgconfig:$PKG_CONFIG_PATH"
          export LDFLAGS="-L/usr/local/opt/qt@5/lib"
          export CPPFLAGS="-I/usr/local/opt/qt@5/include"
        elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          # Set Qt environment variables for Linux
          export QT_SELECT=qt5
          export QT_PLUGIN_PATH=/usr/lib/x86_64-linux-gnu/qt5/plugins
          export QT_QPA_PLATFORM_PLUGIN_PATH=/usr/lib/x86_64-linux-gnu/qt5/plugins/platforms
        fi
        
        # Use the same test target for both platforms
        echo "=== Running tests ==="
        make test > test-output.txt 2>&1 || { 
          cat test-output.txt
          echo "failed=true" >> $GITHUB_OUTPUT
        }
        
    - name: Prepare Issue Content
      if: steps.test.outputs.failed == 'true'
      run: |
        # Get test output
        TEST_OUTPUT=$(cat test-output.txt)
        echo "FAILURE_TYPE=Test" >> $GITHUB_ENV
        echo "TEST_OUTPUT<<EOF" >> $GITHUB_ENV
        echo "$TEST_OUTPUT" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
        
        # Create a short summary
        FAILED_COUNT=$(grep -o 'test cases failed' test-output.txt | wc -l)
        echo "TEST_SUMMARY=Failed $FAILED_COUNT test cases" >> $GITHUB_ENV
    
    - name: Set DateTime for Issue
      if: steps.build.outputs.failed == 'true' || steps.test.outputs.failed == 'true'
      run: |
        # Generate current datetime in format: YYYY-MM-DD HH:MM UTC
        echo "DATETIME=$(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_ENV
      continue-on-error: true
    
    - name: Create Issue on Failure
      uses: JasonEtco/create-an-issue@v2
      if: steps.build.outputs.failed == 'true' || steps.test.outputs.failed == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        OS: ${{ matrix.os }}
        # Explicitly provide GitHub context variables
        GH_SHA: ${{ github.sha }}
        GH_REF_NAME: ${{ github.ref_name }}
        GH_ACTOR: ${{ github.actor }}
        GH_REPOSITORY: ${{ github.repository }}
        GH_RUN_ID: ${{ github.run_id }}
        GH_HEAD_COMMIT: ${{ toJSON(github.event.head_commit.message) }}
      with:
        filename: .github/test-failure-template.md
        update_existing: false
